services:

  # ─── MySQL database (schema and demo data come from Flyway in the API) ─────
  mysql:
    image: mysql:8.0
    container_name: emobility-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-emobility}
      MYSQL_USER: ${MYSQL_USER:-student}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-student}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP, not the socket: the temporary server that runs the init step has no
      # networking, so the API only starts once the real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Spring Boot backend ───────────────────────────────────────────────────
  backend:
    image: emobility-hub-backend:local
    build:
      context: ./emobility-hub
      dockerfile: Dockerfile
    container_name: emobility-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-emobility}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-student}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-student}
      TOKEN_SIGNING_KEY: ${JWT_SIGNING_KEY:-413F4428472B4B6250655368566D5970337336763979244226452948404D6351}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/seed}
      FRONTEND_URL: http://localhost
      PROMOTIONS_URL: http://localhost:8082
      FILE_UPLOAD_DIR: /app/uploads
      BACKEND_URL: http://localhost:8080
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy

  # ─── JSP client application (Tomcat, JDBC) ─────────────────────────────────
  jsp-user:
    image: emobility-hub-user:local
    build:
      context: ./emobility-hub-user
      dockerfile: Dockerfile
    container_name: emobility-jsp-user
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-emobility}?useUnicode=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-student}
      DB_PASSWORD: ${MYSQL_PASSWORD:-student}
    volumes:
      # client avatars
      - avatars_data:/tmp/uploads
    depends_on:
      # The API owns the schema: wait until Flyway has created it.
      backend:
        condition: service_healthy

  # ─── JSP promotions application (Tomcat, REST client) ──────────────────────
  jsp-promotions:
    image: emobility-hub-promotions:local
    build:
      context: ./emobility-hub-promotions
      dockerfile: Dockerfile
    container_name: emobility-jsp-promotions
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      LOGIN_URL: http://backend:8080/auth/login
      PROMOTIONS_URL: http://backend:8080/promotions
      ANNOUNCEMENTS_URL: http://backend:8080/announcements
    depends_on:
      backend:
        condition: service_healthy

  # ─── Angular employee app + Nginx ──────────────────────────────────────────
  frontend:
    image: emobility-hub-employee:local
    build:
      context: ./emobility-hub-employee
      dockerfile: Dockerfile
    container_name: emobility-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
    name: emobility_mysql_data
  uploads_data:
    name: emobility_uploads_data
  avatars_data:
    name: emobility_avatars_data
