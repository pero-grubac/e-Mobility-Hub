version: '3.8'

services:

  # ─── MySQL database ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: emobility-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Spring Boot backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./emobility-hub
      dockerfile: Dockerfile
    container_name: emobility-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      TOKEN_SIGNING_KEY: ${JWT_SIGNING_KEY}
      FRONTEND_URL: http://localhost
      PROMOTIONS_URL: http://emobility-jsp-promotions:8080
      FILE_UPLOAD_DIR: /app/uploads
      FILE_TEMP_DIR: /app/temp
      BACKEND_URL: http://localhost:8080
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # ─── JSP User application (Tomcat) ────────────────────────────────────────
  jsp-user:
    build:
      context: ./emobility-hub-user
      dockerfile: Dockerfile
    container_name: emobility-jsp-user
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # ─── JSP Promotions application (Tomcat) ──────────────────────────────────
  jsp-promotions:
    build:
      context: ./emobility-hub-promotions
      dockerfile: Dockerfile
    container_name: emobility-jsp-promotions
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - backend

  # ─── Angular Employee frontend + Nginx ────────────────────────────────────
  frontend:
    build:
      context: ./emobility-hub-employee
      dockerfile: Dockerfile
    container_name: emobility-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    name: emobility_mysql_data
  uploads_data:
    name: emobility_uploads_data