server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Same limit as the API (spring.servlet.multipart.max-file-size)
    client_max_body_size 10m;

    # Proxy image requests to backend
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API calls go under /api, so they never clash with Angular routes such as
    # /rentals or /statistics (which must load the app on refresh).
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
