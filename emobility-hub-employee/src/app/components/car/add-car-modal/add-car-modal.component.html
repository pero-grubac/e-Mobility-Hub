<h2 mat-dialog-title>Add New Car</h2>
<mat-dialog-content>
  <form>
    <!-- Model -->
    <div class="form-group">
      <label>Model</label>
      <input
        [(ngModel)]="car.model"
        class="form-control"
        name="model"
        required
        type="text"
      />
    </div>

    <!-- Purchase Price -->
    <div class="form-group">
      <label>Purchase Price</label>
      <input
        [(ngModel)]="car.purchasePrice"
        class="form-control"
        name="purchasePrice"
        required
        type="number"
      />
    </div>

    <!-- Rent Price -->
    <div class="form-group">
      <label>Rent Price</label>
      <input
        [(ngModel)]="car.rentPrice"
        class="form-control"
        name="rentPrice"
        required
        type="number"
      />
    </div>

    <!-- Purchase Date -->
    <div class="form-group">
      <label>Purchase Date</label>
      <input
        [(ngModel)]="car.purchaseDate"
        class="form-control"
        name="purchaseDate"
        required
        type="datetime-local"
      />
    </div>

    <!-- Description -->
    <div class="form-group">
      <label>Description</label>
      <textarea
        [(ngModel)]="car.description"
        class="form-control"
        name="description"
        required
      ></textarea>
    </div>

    <!-- Manufacturer -->
    <div class="form-group">
      <label>Manufacturer</label>
      <select
        [(ngModel)]="car.manufacturerId"
        class="form-control"
        name="manufacturer"
      >
        <option
          *ngFor="let manufacturer of manufacturers"
          [value]="manufacturer.id"
        >
          {{ manufacturer.name }}
        </option>
      </select>
    </div>

    <!-- Unique Identifier -->
    <div class="form-group unique-id-container">
      <label>Unique Identifier</label>
      <div class="input-group">
        <input
          [(ngModel)]="car.uniqueIdentifier"
          class="form-control"
          name="uniqueIdentifier"
          placeholder="Enter or generate ID"
          required
          type="text"
        />
        <button
          (click)="generateUniqueId()"
          class="btn-generate-id"
          mat-button
          type="button"
        >
          Generate
        </button>
      </div>
    </div>

    <!-- Upload Image -->
    <div class="form-group upload-container">
      <label>Upload Image</label>
      <div class="input-group">
        <input
          (change)="onImageSelected($event)"
          accept="image/*"
          class="form-control-file"
          type="file"
        />
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button (click)="onCancel()" class="btn-cancel" mat-button>Cancel</button>
  <button
    (click)="onAdd()"
    [disabled]="!isFormValid()"
    class="btn-add"
    mat-button
  >
    Add
  </button>
</mat-dialog-actions>
