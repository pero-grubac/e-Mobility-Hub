<div class="page">
  <h1 class="page-title">Cars</h1>
  <app-vehicle-list
    (addEvent)="handleAdd()"
    (deleteEvent)="handleDelete($event)"
    (pageChange)="handlePageChange($event)"
    (searchEvent)="handleSearch($event)"
    (uploaded)="load()"
    (vehicleSelected)="handleVehicleSelected($event)"
    [columns]="columns"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [vehicles]="cars"
  ></app-vehicle-list>
</div>
