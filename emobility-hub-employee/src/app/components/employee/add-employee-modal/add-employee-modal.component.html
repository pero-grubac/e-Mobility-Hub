<div class="modal-overlay">
  <div class="modal-container">
    <h2>Create New Employee</h2>
    <form>
      <div class="form-group">
        <label for="username">Username:</label>
        <input
          [(ngModel)]="employee.username"
          id="username"
          name="username"
          required
          type="text"
        />
      </div>
      <div class="form-group">
        <label for="firstName">First Name:</label>
        <input
          [(ngModel)]="employee.firstName"
          id="firstName"
          name="firstName"
          required
          type="text"
        />
      </div>
      <div class="form-group">
        <label for="lastName">Last Name:</label>
        <input
          [(ngModel)]="employee.lastName"
          id="lastName"
          name="lastName"
          required
          type="text"
        />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input
          [(ngModel)]="employee.password"
          id="password"
          name="password"
          required
          type="password"
        />
      </div>
      <div class="form-group">
        <label for="role">Role:</label>
        <select [(ngModel)]="employee.role" id="role" name="role" required>
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
      </div>
    </form>
    <div class="actions">
      <button (click)="onSave()" class="save-button">Save</button>
      <button (click)="onCancel()" class="cancel-button">Cancel</button>
    </div>
  </div>
</div>
