<div *ngIf="employee" class="employee-detail-container">
  <h2>Employee Details</h2>
  <form class="employee-form">
    <div class="form-group">
      <label for="username">Username:</label>
      <input
        [(ngModel)]="employee.username"
        class="form-control"
        id="username"
        name="username"
        readonly
        type="text"
      />
    </div>
    <div class="form-group">
      <label for="firstName">First Name:</label>
      <input
        [(ngModel)]="employee.firstName"
        class="form-control"
        id="firstName"
        name="firstName"
        type="text"
      />
    </div>
    <div class="form-group">
      <label for="lastName">Last Name:</label>
      <input
        [(ngModel)]="employee.lastName"
        class="form-control"
        id="lastName"
        name="lastName"
        type="text"
      />
    </div>
    <div class="form-group">
      <label for="role">Role:</label>
      <select
        [(ngModel)]="employee.role"
        class="form-control"
        id="role"
        name="role"
      >
        <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
      </select>
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input
        [(ngModel)]="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="Enter new password (optional)"
        type="password"
      />
    </div>
  </form>

  <div class="actions">
    <button (click)="onUpdate()" class="update-button">Update</button>
    <button (click)="onDelete()" class="delete-button">Delete</button>
  </div>
</div>
