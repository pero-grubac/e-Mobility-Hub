<div class="page">
  <h1 class="page-title">Employees</h1>
  <div class="toolbar">
    <input
      (input)="onSearch($any($event.target).value)"
      class="search-input"
      placeholder="Search by username"
      type="search"
    />
    <button (click)="onAdd()" class="btn btn-primary" type="button">Add</button>
  </div>

  <div class="employee-list">
    <app-employee-item
      (employeeClick)="handleEmployeeSelected($event)"
      *ngFor="let employee of employees"
      [employee]="employee"
    ></app-employee-item>
  </div>

  <app-pagination
    (pageChange)="onPageChange($event)"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
  ></app-pagination>
</div>
