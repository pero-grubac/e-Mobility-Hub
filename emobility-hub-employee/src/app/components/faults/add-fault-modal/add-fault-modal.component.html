<div class="modal-overlay">
  <div class="modal-container">
    <h2>Report Fault</h2>
    <form>
      <div class="form-group">
        <label for="description">Fault Description:</label>
        <textarea
          (keyup)="validateDescription()"
          [(ngModel)]="description"
          class="form-control large-input"
          id="description"
          name="description"
          placeholder="Enter fault details..."
        ></textarea>
        <p *ngIf="showError" class="error-message">Description is required.</p>
      </div>
    </form>

    <div class="actions">
      <button (click)="onAdd()" [disabled]="showError" class="btn btn-success">
        Add
      </button>
      <button (click)="onCancel()" class="btn btn-danger">Cancel</button>
    </div>
  </div>
</div>
