<div class="modal-overlay">
  <div class="modal-container">
    <h2>Fault Details</h2>
    <form #faultForm="ngForm">
      <div class="form-group">
        <label for="description">Description:</label>
        <textarea
          #description="ngModel"
          [(ngModel)]="fault.description"
          class="form-control"
          id="description"
          maxlength="1500"
          name="description"
          required
        ></textarea>
        <div *ngIf="description.invalid" class="field-error">
          Description is required.
        </div>
      </div>

      <div class="form-group">
        <label>Creation Date & Time:</label>
        <p class="timestamp">
          {{ fault.creationDateTime | date: "dd.MM.yyyy. HH:mm" }}
        </p>
      </div>
    </form>

    <div class="actions">
      <button
        (click)="onUpdate()"
        [disabled]="faultForm.invalid"
        class="update-button"
      >
        Update
      </button>
      <button (click)="onDelete()" class="delete-button">Delete</button>
      <button (click)="onCancel()" class="cancel-button">Cancel</button>
    </div>
  </div>
</div>
