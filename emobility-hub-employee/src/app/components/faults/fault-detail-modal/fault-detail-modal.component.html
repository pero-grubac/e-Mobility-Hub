<div class="modal-overlay">
  <div class="modal-container">
    <h2>Fault Details</h2>
    <form>
      <div class="form-group">
        <label for="description">Description:</label>
        <textarea
          [(ngModel)]="fault.description"
          class="form-control"
          id="description"
          name="description"
        ></textarea>
      </div>

      <div class="form-group">
        <label>Creation Date & Time:</label>
        <p class="timestamp">
          {{ fault.creationDateTime | date: "dd.MM.yyyy. HH:mm" }}
        </p>
      </div>
    </form>

    <div class="actions">
      <button (click)="onUpdate()" class="update-button">Update</button>
      <button (click)="onDelete()" class="delete-button">Delete</button>
      <button (click)="onCancel()" class="cancel-button">Cancel</button>
    </div>
  </div>
</div>
