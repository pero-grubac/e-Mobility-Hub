<div (click)="onClick()" class="fault-item">
  <img
    alt="Fault Icon"
    class="fault-icon"
    src="assets/images/broken-vehicle.png"
  />
  <p [title]="fault.description" class="fault-description">
    {{ truncatedDescription }}
  </p>
  <p class="fault-time">
    Update time: {{ fault.updateDateTime | date: "dd.MM.yyyy. HH:mm" }}
  </p>
</div>
