<mat-toolbar class="custom-toolbar" color="primary">
  <a class="logo-link" routerLink="/">
    <span class="logo">eMobilityHub</span>
  </a>
  <span class="spacer"></span>
  <button
    *ngIf="hasRole(['ROLE_ADMIN', 'ROLE_MANAGER', 'ROLE_OPERATOR'])"
    class="menu-button"
    mat-button
    routerLink="/cars"
  >
    Car
  </button>
  <button
    *ngIf="hasRole(['ROLE_ADMIN', 'ROLE_MANAGER', 'ROLE_OPERATOR'])"
    class="menu-button"
    mat-button
    routerLink="/bicycles"
  >
    Bicycle
  </button>
  <button
    *ngIf="hasRole(['ROLE_ADMIN', 'ROLE_MANAGER', 'ROLE_OPERATOR'])"
    class="menu-button"
    mat-button
    routerLink="/scooters"
  >
    Scooter
  </button>
  <button
    *ngIf="hasRole(['ROLE_ADMIN', 'ROLE_MANAGER'])"
    class="menu-button"
    mat-button
    routerLink="/manufacturers"
  >
    Manufacturer
  </button>
  <button
    *ngIf="hasRole(['ROLE_ADMIN', 'ROLE_MANAGER', 'ROLE_OPERATOR'])"
    class="menu-button"
    mat-button
    routerLink="/clients"
  >
    Client
  </button>
  <button
    *ngIf="hasRole(['ROLE_ADMIN', 'ROLE_MANAGER'])"
    class="menu-button"
    mat-button
    routerLink="/employees"
  >
    Employee
  </button>
  <button
    *ngIf="hasRole(['ROLE_OPERATOR', 'ROLE_MANAGER'])"
    class="menu-button"
    mat-button
    routerLink="/rentals"
  >
    Rentals
  </button>
  <button
    *ngIf="hasRole(['ROLE_MANAGER'])"
    class="menu-button"
    mat-button
    routerLink="/statistics"
  >
    Statistic
  </button>
  <button (click)="onLogout()" class="logout-button" color="warn" mat-button>
    Logout
  </button>
</mat-toolbar>
