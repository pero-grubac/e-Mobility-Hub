<div *ngIf="manufacturer" class="manufacturer-detail-container">
  <h2>Manufacturer Details</h2>
  <form class="manufacturer-form">
    <div class="form-group">
      <label for="name">Name:</label>
      <input
        [(ngModel)]="manufacturer.name"
        class="form-control"
        id="name"
        name="name"
        type="text"
      />
    </div>
    <div class="form-group">
      <label for="address">Address:</label>
      <input
        [(ngModel)]="manufacturer.address"
        class="form-control"
        id="address"
        name="address"
        type="text"
      />
    </div>
    <div class="form-group">
      <label for="contactPhone">Contact Phone:</label>
      <input
        [(ngModel)]="manufacturer.contactPhone"
        class="form-control"
        id="contactPhone"
        name="contactPhone"
        type="text"
      />
    </div>
    <div class="form-group">
      <label for="contactEmail">Contact Email:</label>
      <input
        [(ngModel)]="manufacturer.contactEmail"
        class="form-control"
        id="contactEmail"
        name="contactEmail"
        type="email"
      />
    </div>
    <div class="form-group">
      <label for="contactFax">Contact Fax:</label>
      <input
        [(ngModel)]="manufacturer.contactFax"
        class="form-control"
        id="contactFax"
        name="contactFax"
        type="text"
      />
    </div>
    <div class="form-group">
      <label for="country">Country:</label>
      <input
        [(ngModel)]="manufacturer.country"
        class="form-control"
        id="country"
        name="country"
        type="text"
      />
    </div>
  </form>

  <div class="actions">
    <button (click)="onUpdate()" class="update-button">Update</button>
    <button (click)="onDelete()" class="delete-button">Delete</button>
  </div>
</div>
