<div class="page">
  <h1 class="page-title">Manufacturers</h1>
  <div class="toolbar">
    <input
      (input)="onSearch($any($event.target).value)"
      class="search-input"
      placeholder="Search by name"
      type="search"
    />
    <button (click)="onAdd()" class="btn btn-primary" type="button">Add</button>
  </div>

  <div class="manufacturer-list">
    <app-manufacturer-item
      (manufacturerClick)="onManufacturerSelected($event)"
      *ngFor="let manufacturer of manufacturers"
      [manufacturer]="manufacturer"
    ></app-manufacturer-item>
  </div>

  <app-pagination
    (pageChange)="onPageChange($event)"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
  ></app-pagination>
</div>
