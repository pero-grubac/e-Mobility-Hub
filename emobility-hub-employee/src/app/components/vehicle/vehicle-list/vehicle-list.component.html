<div class="vehicle-list-container">
  <div class="vehicle-list-header">
    <div class="search-bar-container">
      <input
        (input)="onSearch($event.target.value)"
        class="search-input"
        placeholder="Search by model"
        type="text"
      />
      <button
        (click)="onAdd()"
        *ngIf="hasRole(['ROLE_ADMIN', 'ROLE_MANAGER'])"
        class="add-button"
      >
        Add
      </button>
      <button
        (click)="openModal()"
        *ngIf="hasRole(['ROLE_ADMIN', 'ROLE_MANAGER'])"
        [disabled]="isUploading"
        class="upload-button"
      >
        Upload
      </button>
    </div>
  </div>

  <div class="vehicle-list">
    <app-vehicle-item
      (vehicleClick)="onVehicleSelected($event)"
      *ngFor="let vehicle of vehicles"
      [vehicle]="vehicle"
    ></app-vehicle-item>
  </div>

  <div class="pagination">
    <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 0">
      Previous
    </button>

    <button
      (click)="handlePageClick(page)"
      *ngFor="let page of displayedPages"
      [class.active]="page === currentPage"
      [disabled]="!isNumber(page)"
    >
      {{ page }}
    </button>

    <button
      (click)="goToPage(currentPage + 1)"
      [disabled]="currentPage + 1 >= totalPages"
    >
      Next
    </button>
  </div>
  <p *ngIf="uploadStatus" class="upload-status">{{ uploadStatus }}</p>

  <div (click)="closeModal()" *ngIf="isModalOpen" class="modal">
    <div (click)="$event.stopPropagation()" class="modal-content">
      <h2>Upload CSV File</h2>
      <input
        (change)="onFileSelected($event)"
        accept=".csv"
        class="file-input"
        type="file"
      />
      <div class="modal-actions">
        <button (click)="uploadFile()" [disabled]="!selectedFile">
          Upload
        </button>
        <button (click)="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>
