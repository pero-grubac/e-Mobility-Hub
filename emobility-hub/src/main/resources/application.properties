spring.application.name=emobility-hub
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/emobility}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:student}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Flyway: db/migration holds the schema, db/seed the demo data.
# Set FLYWAY_LOCATIONS=classpath:db/migration to start with an empty database.
# A database created by the old ddl.sql/seed.sql init scripts is baselined at 1.1.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.1

file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Development-only default. Always set TOKEN_SIGNING_KEY outside local development.
token.signing.key=${TOKEN_SIGNING_KEY:413F4428472B4B6250655368566D5970337336763979244226452948404D6351}
token.expiration=${TOKEN_EXPIRATION:PT24H}
auth.cookie.name=EMH_SESSION
# true behind HTTPS
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

frontend.url=${FRONTEND_URL:http://localhost:4200}
promotions.url=${PROMOTIONS_URL:http://localhost:8082}
backend.url=${BACKEND_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
